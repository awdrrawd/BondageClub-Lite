name: Site Health Check

on:
  schedule:
    - cron: '0 0 * * 0' # 調整為每週執行 (UTC 時間週日 00:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-site.mjs
            package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run Site Health Check
        id: health_check
        continue-on-error: true # 僅開 Issue 不報錯
        run: node scripts/check-site.mjs

      - name: Report Failure (Create or Comment Issue)
        if: steps.health_check.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'site-health-alert' });
            const body = `🚨 自動每週檢查發現網站狀態異常！\n請檢查 Action 日誌：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issues.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🚨 網站健康度檢查失敗', body, labels: ['site-health-alert'] });
            }

      - name: Close Issue on Success
        if: steps.health_check.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'site-health-alert' });
            if (issues.data.length > 0) {
              const issue_number = issues.data[0].number;
              await github.rest.issues.createComment({ owner, repo, issue_number, body: '✅ 最新一次的每週檢查已恢復正常，自動關閉此 Issue。' });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });
            }