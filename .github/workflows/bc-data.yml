name: BC text data update
on:
  schedule:
    - cron: '23 3 5,10,15,20,25,30 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bc-text-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Mater
      - name: Check pending data PR
        id: pending
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("codex/bc-data-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pending.outputs.count == '0'
        with:
          node-version: '22'
          cache: npm
      - name: Download pinned text sources
        if: steps.pending.outputs.count == '0'
        run: node scripts/fetch-bc-text.mjs "$RUNNER_TEMP/bc-text"
      - name: Extract and validate
        if: steps.pending.outputs.count == '0'
        run: |
          npm ci
          npm run catalog:bc -- "$RUNNER_TEMP/bc-text"
          npm run ci
      - name: Propose text changes
        if: steps.pending.outputs.count == '0'
        run: |
          if git diff --quiet -- src/translations/bc; then
            echo "No BC text changes."
            exit 0
          fi
          branch="codex/bc-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/translations/bc
          git commit -m 'data: update BC text catalogs'
          git push origin "$branch"
          gh pr create --base Mater --head "$branch" --title 'data: update BC text catalogs' --body-file "$RUNNER_TEMP/bc-text/PR.md"
